  <!-- Chanis Gate (draft scene for the LoTM lockscreen, Threshold, Gate and
       Vigil brief phase 2). Looking up from the crypt floor: a ribbed vault,
       a pointed stone arch with tracery bands, and the black iron split gate
       carrying the seven sacred emblems, with candle sconces either side.
       Original art; cold verdigris and iron, gilt only on the emblems. -->
