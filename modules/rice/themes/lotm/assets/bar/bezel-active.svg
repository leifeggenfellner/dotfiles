<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
  <!-- Workspace bezel, polished: the active workspace (D-065). The sigil sits in the well, drawn by the runtime. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1bf"/>
      <stop offset="0.55" stop-color="#e8c76f"/>
      <stop offset="1" stop-color="#c79a3a"/>
    </linearGradient>
    <radialGradient id="well" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#241a10"/>
      <stop offset="1" stop-color="#151009"/>
    </radialGradient>
  </defs>
  <circle cx="15" cy="15" r="14.2" fill="url(#rim)"/>
  <circle cx="15" cy="15" r="11.6" fill="url(#well)" stroke="#c79a3a" stroke-width="0.8"/>
  <path d="M6.2 9.4A10.4 10.4 0 0 1 12.4 4.0" fill="none" stroke="#fff6d6" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/>
</svg>
