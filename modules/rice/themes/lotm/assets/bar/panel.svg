<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Surface plate (D-076) for the launcher, dashboard and notification
       centre. Nine-sliced [18 18 18 18]: a dark umber plate in a double
       brass rule, with a diamond boss and a gilt leaf in each corner. All
       of it stays inside the surfaces' 16 px content margin. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18110a"/>
      <stop offset="1" stop-color="#0f0a06"/>
    </linearGradient>
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cf7e"/>
      <stop offset="0.5" stop-color="#c79a3a"/>
      <stop offset="1" stop-color="#6a4c1a"/>
    </linearGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fbe3a0"/>
      <stop offset="0.6" stop-color="#b8892f"/>
      <stop offset="1" stop-color="#4a3714"/>
    </radialGradient>
    <g id="corner">
      <path d="M9 9 C 13 9.4, 15 11.4, 14.6 14.6 C 11.4 15, 9.4 13, 9 9 Z" fill="url(#gilt)" stroke="#2a1d0c" stroke-width="0.5"/>
      <path d="M5.5 1.5 L 9.5 5.5 L 5.5 9.5 L 1.5 5.5 Z" fill="url(#gilt)" stroke="#4a3714" stroke-width="0.6"/>
      <circle cx="5.5" cy="5.5" r="1.4" fill="url(#rivet)"/>
    </g>
  </defs>
  <rect x="0" y="0" width="96" height="96" fill="url(#body)" fill-opacity="0.97"/>
  <rect x="1" y="1" width="94" height="94" fill="none" stroke="#7a5a22" stroke-width="2"/>
  <rect x="4.5" y="4.5" width="87" height="87" fill="none" stroke="#c79a3a" stroke-opacity="0.85"/>
  <rect x="7.5" y="7.5" width="81" height="81" fill="none" stroke="#c79a3a" stroke-opacity="0.25"/>
  <use href="#corner"/>
  <use href="#corner" transform="matrix(-1 0 0 1 96 0)"/>
  <use href="#corner" transform="matrix(1 0 0 -1 0 96)"/>
  <use href="#corner" transform="matrix(-1 0 0 -1 96 96)"/>
</svg>
