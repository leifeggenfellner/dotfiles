<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Hinged popout plate (D-070). Nine-sliced [22 16 22 18]: a dark umber
       plate in a brass rule, hung from a brass hinge leaf along its top
       edge, with a hinge barrel in each top corner and a rivet in each
       bottom corner. Edges are straight runs so they stretch cleanly. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18110a"/>
      <stop offset="1" stop-color="#0f0a06"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0b65a"/>
      <stop offset="0.5" stop-color="#b8892f"/>
      <stop offset="1" stop-color="#6a4c1a"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e4318"/>
      <stop offset="0.45" stop-color="#f0cf7e"/>
      <stop offset="1" stop-color="#7a5a22"/>
    </linearGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f0cf7e"/>
      <stop offset="0.6" stop-color="#b8892f"/>
      <stop offset="1" stop-color="#5e4318"/>
    </radialGradient>
  </defs>
  <rect x="1" y="2" width="94" height="93" rx="4" fill="url(#body)" fill-opacity="0.97"/>
  <rect x="1.5" y="2.5" width="93" height="92" rx="3.5" fill="none" stroke="#7a5a22" stroke-width="1.5"/>
  <rect x="5.5" y="10.5" width="85" height="80" rx="2" fill="none" stroke="#c79a3a" stroke-opacity="0.6"/>
  <rect x="0" y="0" width="96" height="6" fill="url(#leaf)"/>
  <rect x="0" y="6" width="96" height="1" fill="#000" fill-opacity="0.5"/>
  <rect x="6" y="0" width="10" height="8" rx="2" fill="url(#barrel)" stroke="#4a3714" stroke-width="0.6"/>
  <rect x="80" y="0" width="10" height="8" rx="2" fill="url(#barrel)" stroke="#4a3714" stroke-width="0.6"/>
  <circle cx="11" cy="86" r="2.2" fill="url(#rivet)"/>
  <circle cx="85" cy="86" r="2.2" fill="url(#rivet)"/>
</svg>
