<svg xmlns="http://www.w3.org/2000/svg" width="96" height="44" viewBox="0 0 96 44">
  <!-- Brass Rail body (D-063). Nine-sliced [24 0 24 0]; the middle
       48 px repeats, so its ticks run the full width like a ruler. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a211a"/>
      <stop offset="1" stop-color="#151009"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c76f"/>
      <stop offset="0.5" stop-color="#c79a3a"/>
      <stop offset="1" stop-color="#7a5a22"/>
    </linearGradient>
  </defs>
  <rect width="96" height="44" fill="url(#body)"/>
  <rect width="96" height="1" fill="#3e3121"/>
  <rect x="35.5" y="35" width="1" height="4" fill="#c79a3a" fill-opacity="0.75"/><rect x="59.5" y="35" width="1" height="4" fill="#c79a3a" fill-opacity="0.75"/>
  <rect y="39" width="96" height="1" fill="#e6d7b8" fill-opacity="0.5"/>
  <rect y="40" width="96" height="4" fill="url(#rule)"/>
  <rect y="43" width="96" height="1" fill="#7a5a22"/>
  <rect x="0" y="0" width="3" height="44" fill="url(#rule)"/>
  <rect x="93" y="0" width="3" height="44" fill="url(#rule)"/>
  <circle cx="12" cy="42" r="1.4" fill="#e8c76f"/>
  <circle cx="84" cy="42" r="1.4" fill="#e8c76f"/>
</svg>
