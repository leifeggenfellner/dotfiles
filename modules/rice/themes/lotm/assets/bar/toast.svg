<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Toast plate (D-076). Nine-sliced [10 10 10 10]: a small umber plate
       in a brass rule with a rivet in each corner, inside the toasts'
       12 px content margin. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18110a"/>
      <stop offset="1" stop-color="#0f0a06"/>
    </linearGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fbe3a0"/>
      <stop offset="0.6" stop-color="#b8892f"/>
      <stop offset="1" stop-color="#4a3714"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="48" height="48" fill="url(#body)" fill-opacity="0.97"/>
  <rect x="1" y="1" width="46" height="46" fill="none" stroke="#7a5a22" stroke-width="2"/>
  <rect x="3.5" y="3.5" width="41" height="41" fill="none" stroke="#c79a3a" stroke-opacity="0.75"/>
  <circle cx="6.5" cy="6.5" r="1.3" fill="url(#rivet)"/>
  <circle cx="41.5" cy="6.5" r="1.3" fill="url(#rivet)"/>
  <circle cx="6.5" cy="41.5" r="1.3" fill="url(#rivet)"/>
  <circle cx="41.5" cy="41.5" r="1.3" fill="url(#rivet)"/>
</svg>
