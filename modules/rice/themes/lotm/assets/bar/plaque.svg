    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="31" height="31" rx="3.5" fill="url(#well)" stroke="#7a5a22"/>
  <path d="M1.5 27.5 Q1.5 30.5 4.5 30.5 H27.5 Q30.5 30.5 30.5 27.5 V4.5" fill="none" stroke="#c79a3a" stroke-opacity="0.85"/>
  <rect x="2" y="1.5" width="28" height="2.5" rx="1.2" fill="#000" fill-opacity="0.4"/>
